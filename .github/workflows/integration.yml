name: Integration

on:
  pull_request:
  push:
    branches: [main]

env:
  BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

jobs:
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: 3.14

      - name: Create project
        run: uvx --from expanse-cli expanse new my-app

      - name: Setup project
        run: |
          cd my-app
          cp .env.example .env
          uv add git+https://github.com/expanse-framework/expanse.git@${BRANCH_NAME}
          uv sync --group test

      - name: Create keys
        run: |
          cd my-app
          uv run python ./beam encryption key generate -vvv

      - name: Execute migrations
        run: |
          cd my-app
          uv run python ./beam db migrate -vvv

      - name: Execute tests
        run: |
          cd my-app
          uv run pytest tests

      #- name: Start server
      #  run: |
      #    cd my-app
      #    uv run python ./beam serve --port 8000 & curl -s http://localhost:8000
